<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>

  <!-- Fonte igual ao site -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS da página -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <h2 class="logo">Criar conta</h2>

    <!-- Mantido o form original -->
    <form id="cadastroForm" enctype="multipart/form-data">
  <div class="form-group">
    <input type="file" id="foto" name="foto" accept="image/*">
  </div>

  <div class="form-group">
    <input type="text" id="nome" name="nome" placeholder="Nome" required>
  </div>

  <div class="form-group">
    <input type="password" id="senha" name="senha" placeholder="Senha" required>
  </div>

  <div class="form-group">
    <select id="funcao_social" name="funcao_social" required>
      <option value="" disabled selected>Selecione a função</option>
      <option value="Aluno">Aluno</option>
      <option value="Professor">Professor</option>
      <option value="Administrador">Administrador</option>
    </select>
  </div>

  <button class="btn-primary" type="submit">Cadastrar</button>
</form>

    <p id="mensagem"></p>

    <a href="login.html" class="link">Já tenho uma conta</a>
  </div>

  <script src="cadastro.js"></script>
</body>
</html>
